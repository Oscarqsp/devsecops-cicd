name: CI/CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Installation des dépendances
        working-directory: ./app
        run: npm install

      - name: Audit sécurité des dépendances npm
        working-directory: ./app
        run: npm audit --audit-level=high || true

      - name: Build image Docker
        run: docker build -t devsecops-app:latest ./app

      - name: Scan de vulnérabilités Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  deploy:
    name: Déploiement EC2
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu
            git clone https://github.com/Oscarqsp/devsecops-cicd.git || git -C devsecops-cicd pull
            docker stop devsecops-app || true
            docker rm devsecops-app || true
            docker build -t devsecops-app:latest ./devsecops-cicd/app
            docker run -d --name devsecops-app -p 3000:3000 devsecops-app:latest
            echo "Déployé avec succès"
