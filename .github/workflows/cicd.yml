name: CI/CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Installation des dépendances
        working-directory: ./app
        run: npm install
      - name: Audit sécurité des dépendances npm
        working-directory: ./app
        run: npm audit --audit-level=high || true
      - name: Build image Docker
        run: docker build -t devsecops-app:latest ./app
      - name: Scan de vulnérabilités Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  docker-compose-test:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Créer le fichier .env (Mistral, secrets.MISTRAL_API_KEY)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          printf 'MISTRAL_API_KEY=%s\n' "${MISTRAL_API_KEY:-}" > .env
      - name: Lancement de la stack Docker Compose
        run: docker compose up -d
      - name: Vérification des conteneurs
        run: |
          sleep 10
          docker compose ps
          docker ps
      - name: Arrêt de la stack
        run: docker compose down
  
  check-monitoring:
    name: "Vérification Monitoring"
    runs-on: ubuntu-latest
    needs: docker-compose-test
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Création du dossier monitoring si inexistant
        run: mkdir -p monitoring

      - name: Vérification syntaxe Prometheus
        run: |
          docker run --rm -v $(pwd)/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus promtool check config /etc/prometheus/prometheus.yml

  stop-ec2:
    name: Arrêt EC2
    runs-on: ubuntu-latest
    needs: docker-compose-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 instance
        run: |
          aws ec2 stop-instances --instance-ids ${{ secrets.INSTANCE_ID }}
          aws ec2 wait instance-stopped --instance-ids ${{ secrets.INSTANCE_ID }}

  start-ec2:
    name: Démarrage EC2
    runs-on: ubuntu-latest
    needs: stop-ec2
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 instance
        run: |
          aws ec2 start-instances --instance-ids ${{ secrets.INSTANCE_ID }}
          aws ec2 wait instance-running --instance-ids ${{ secrets.INSTANCE_ID }}
          aws ec2 wait instance-status-ok --instance-ids ${{ secrets.INSTANCE_ID }}

  deploy:
    name: Déploiement EC2
    runs-on: ubuntu-latest
    needs: start-ec2
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Fichier .env (secrets → racine du projet)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          printf 'MISTRAL_API_KEY=%s\n' "${MISTRAL_API_KEY:-}" > .env

      - name: Installation clé SSH et known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Copie intégrale du workspace (app, frontend, nginx, monitoring, compose, .env, etc.)
      # — tar + SSH : même contenu que le runner GitHub ; seuls .git et app/node_modules sont exclus.
      - name: Envoyer tout le projet sur l’EC2 (archive + extraction)
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$(pwd)}"
          cd "$WS"
          echo "=== Aperçu du dépôt à déployer ==="
          ls -la
          for d in app frontend nginx monitoring; do
            if [ -d "$d" ]; then echo "--- $d ---"; ls -la "$d" | head -50; fi
          done
          SSH_OPTS=(-i "$HOME/.ssh/ec2_deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes)
          DEST="${EC2_USER}@${EC2_HOST}"
          # Arrêt des conteneurs si une ancienne stack existe (sinon volumes bind peuvent bloquer)
          ssh "${SSH_OPTS[@]}" "$DEST" bash -s <<'REMOTE'
            set -euo pipefail
            D="$HOME/devsecops-cicd"
            C="$D/docker-compose.yml"
            if [[ -f "$C" ]]; then
              sudo docker compose --project-directory "$D" -f "$C" down || true
            fi
          REMOTE
          ssh "${SSH_OPTS[@]}" "$DEST" 'rm -rf "$HOME/devsecops-cicd" && mkdir -p "$HOME/devsecops-cicd"'
          tar -czf - \
            --exclude='./.git' \
            --exclude='./app/node_modules' \
            . | ssh "${SSH_OPTS[@]}" "$DEST" 'tar -xzf - -C "$HOME/devsecops-cicd"'
          echo "=== Fichiers sur l’instance après transfert ==="
          ssh "${SSH_OPTS[@]}" "$DEST" 'ls -la "$HOME/devsecops-cicd"; ls -la "$HOME/devsecops-cicd/app" "$HOME/devsecops-cicd/frontend" "$HOME/devsecops-cicd/nginx" "$HOME/devsecops-cicd/monitoring"'

      - name: Docker Compose sur l’EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="$HOME/devsecops-cicd"
            COMPOSE_FILE="$DEPLOY_DIR/docker-compose.yml"
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER" || true
              sudo systemctl enable --now docker
            fi
            test -f "$COMPOSE_FILE" || { echo "Fichier manquant: $COMPOSE_FILE"; exit 1; }
            sudo docker compose --project-directory "$DEPLOY_DIR" -f "$COMPOSE_FILE" down || true
            sudo docker compose --project-directory "$DEPLOY_DIR" -f "$COMPOSE_FILE" pull || true
            sudo docker compose --project-directory "$DEPLOY_DIR" -f "$COMPOSE_FILE" up -d
            sudo docker compose --project-directory "$DEPLOY_DIR" -f "$COMPOSE_FILE" ps
