name: CI/CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Installation des dépendances
        working-directory: ./app
        run: npm install
      - name: Audit sécurité des dépendances npm
        working-directory: ./app
        run: npm audit --audit-level=high || true
      - name: Build image Docker
        run: docker build -t devsecops-app:latest ./app
      - name: Scan de vulnérabilités Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: 0 # Les vulnérabilités sont détectées et reportées mais ne bloquent pas le déploiement. En production, exit-code: 1 bloquerait tout déploiement avec une CRITICAL.
          severity: HIGH,CRITICAL

  docker-compose-test:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Créer le fichier .env pour les tests
        run: echo "MISTRAL_API_KEY=test" > .env
      - name: Lancement de la stack Docker Compose
        run: docker compose up -d
      - name: Vérification des conteneurs
        run: |
          sleep 10
          docker compose ps
          docker ps
      - name: Arrêt de la stack
        run: docker compose down

  stop-ec2:
    name: Arrêt EC2
    runs-on: ubuntu-latest
    needs: docker-compose-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 instance
        run: |
          aws ec2 stop-instances --instance-ids ${{ secrets.INSTANCE_ID }}
          aws ec2 wait instance-stopped --instance-ids ${{ secrets.INSTANCE_ID }}

  start-ec2:
    name: Démarrage EC2
    runs-on: ubuntu-latest
    needs: stop-ec2
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 instance
        run: |
          aws ec2 start-instances --instance-ids ${{ secrets.INSTANCE_ID }}
          aws ec2 wait instance-running --instance-ids ${{ secrets.INSTANCE_ID }}
          aws ec2 wait instance-status-ok --instance-ids ${{ secrets.INSTANCE_ID }}

  deploy:
    name: Déploiement EC2
    runs-on: ubuntu-latest
    needs: start-ec2
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@master
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MISTRAL_API_KEY
          script: |
            if ! command -v git &> /dev/null; then
              sudo apt install git -y
            fi
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker ubuntu
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            sudo docker compose -f /home/ubuntu/devsecops-cicd/docker-compose.yml down || true
            sudo rm -rf /home/ubuntu/devsecops-cicd
            cd /home/ubuntu
            git clone https://github.com/Oscarqsp/devsecops-cicd.git
            cd devsecops-cicd
            echo "MISTRAL_API_KEY=$MISTRAL_API_KEY" > .env
            sudo docker compose up -d
            sudo docker compose ps
