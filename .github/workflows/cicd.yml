name: CI/CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation des dépendances
        working-directory: ./app
        run: npm install

      - name: Audit sécurité des dépendances npm
        working-directory: ./app
        run: npm audit --audit-level=high || true

      - name: Build image Docker
        run: docker build -t devsecops-app:latest ./app

      - name: Scan de vulnérabilités Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:latest
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  docker-compose-test:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Lancement de la stack Docker Compose
        run: docker compose up -d

      - name: Vérification des conteneurs
        run: |
          sleep 10
          docker compose ps
          docker ps

      - name: Arrêt de la stack
        run: docker compose down

  deploy:
    name: Déploiement EC2
    runs-on: ubuntu-latest
    needs: docker-compose-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker ubuntu
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            cd /home/ubuntu
            git clone https://github.com/Oscarqsp/devsecops-cicd.git || git -C devsecops-cicd pull
            cd devsecops-cicd
            sudo docker compose down || true
            sudo docker compose up -d
            sudo docker compose ps
