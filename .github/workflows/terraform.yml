name: Terraform Deploy

on:
  push:
    branches:
      - test-betsabee

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var="my_ip=0.0.0.0/0"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="my_ip=0.0.0.0/0"
