services:
  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: node:18-alpine
    container_name: backend
    working_dir: /app
    volumes:
      - ./app:/app
    command: sh -c "npm install && node index.js"
    ports:
      - "3000:3000"
#    env_file:
#      - .env
    environment:
      - DB_HOST=database
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=devsecops_db
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mariadb:10.11
    container_name: database
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=devsecops_db
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: monitoring_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=SecuProjet2026!
    restart: unless-stopped

volumes:
  db_data:
  portainer_data:

services:
  # Base de données sécurisée
  db:
    image: mariadb:10.11
    container_name: mariadb_backend
    restart: always
    environment:
      # Utilisation de variables (à définir dans un fichier .env plus tard)
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: crud_db
      MYSQL_USER: user_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - backend_net

  # Votre application CRUD (que nous coderons à l'étape 2)
  app:
    build: ./app
    container_name: crud_app
    restart: always
    depends_on:
      - db
    networks:
      - backend_net
      - frontend_net

  # Frontend Nginx faisant office de Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx_frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - frontend_net

networks:
  frontend_net:
  backend_net:
    internal: true # Réseau isolé pour la DB (Sécurité !)
